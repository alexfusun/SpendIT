services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendit}
      POSTGRES_DB: ${POSTGRES_DB:-spendit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - spendit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-spendit} -d ${POSTGRES_DB:-spendit}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  spendit_pgdata:
